name: Build signed release (Play Store)

# Start it by hand: Actions tab -> "Build signed release (Play Store)" -> Run workflow.
# Needs 4 repository secrets - see RELEASE_GUIDE.md.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v. See RELEASE_GUIDE.md"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build unsigned release
        run: node scripts/build.js --release

      - name: Sign AAB and APK
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          mkdir -p dist
          # App Bundle for Google Play
          cp dist/unsigned/app-release.aab "dist/PewOps-$V-release.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "dist/PewOps-$V-release.aab" "$KEY_ALIAS"
          # Signed APK for sharing outside the Play Store
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 dist/unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out "dist/PewOps-$V-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "dist/PewOps-$V-release.apk" | head -3
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: PewOps-release
          path: |
            dist/PewOps-*-release.aab
            dist/PewOps-*-release.apk
          if-no-files-found: error
